baseURL = "https://dentedreality.com.au/"
locale = "en-US"
title = "Dented Reality"
subtitle = "An aggregation of Beau Lebens on the internet"

[params]
  description = "An aggregation of Beau Lebens on the internet"
  author = "Beau Lebens"
  # Outbound links to these hosts / URL-prefixes stay dofollow; everything else external gets rel="nofollow".
  dofollow = ["pwd.com.au", "theseocompany.com.au", "webdesignperth.com.au", "agencies.semrush.com/pwd-digital-agency", "au.linkedin.com/company/pwdaus"]

[taxonomies]
  category = "categories"
  service = "services"
  # tag = "tags"  # Disabled: tag pages generate 17k+ files, exceeding CF Pages free tier (20k limit)

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[pagination]
  pagerSize = 100

[outputs]
  home = ["HTML", "RSS"]
